<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.t=localStorage.getItem("wijn_t")||"dark"}catch(e){document.documentElement.dataset.t="dark"}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wijnkelder">
<meta name="theme-color" content="#6b1d2a">
<link rel="apple-touch-icon" href="wijn-icon.png">
<style>
:root{--fs:1.25;--fst:1.05;--brand:#8a2236;--accent:#8a2236;--bg:#f5f1ed;--card:#fff;--text:#231a1b;--muted:#4a4041;--line:#e7dfdb;--soft:#f0e8e4;
--ok:#1f6b3f;--okbg:#dff3e6;--warn:#9a5200;--warnbg:#ffecd1;--bad:#c4161c;--badbg:#fcdcdb;--info:#1c5d99;--infobg:#dcebfb;--idle:#5b5870;--idlebg:#ebe8f1;--tabh:68px}
html[data-t=dark]{color-scheme:dark;--accent:#e8929f;--bg:#141011;--card:#211b1c;--text:#f2eae7;--muted:#d6cacb;--line:#352c2d;--soft:#2b2223;
--ok:#7bd69d;--okbg:#16301f;--warn:#ffb866;--warnbg:#3a2a12;--bad:#ff7d76;--badbg:#45201f;--info:#8cc2f5;--infobg:#172a3d;--idle:#bdb8d6;--idlebg:#27242f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st-over{--c:var(--bad);--cb:var(--badbg)}.st-laatste{--c:var(--warn);--cb:var(--warnbg)}.st-nu,.st-piek{--c:var(--ok);--cb:var(--okbg)}.st-beter{--c:var(--info);--cb:var(--infobg)}.st-bewaren{--c:var(--idle);--cb:var(--idlebg)}

/* ----- opzet ----- */
#app{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px)}
.view{display:none}.view.on{display:block}
#pane{display:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 18px) 0 8px}
.top h1{margin:0;font-size:calc(34px*var(--fs));letter-spacing:-.02em;line-height:1.05}
.top .sub{color:var(--muted);font-size:calc(18px*var(--fs));margin-top:4px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--accent);border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.banner{background:var(--warnbg);color:var(--warn);padding:10px 16px;font-size:calc(18px*var(--fs))}

/* ----- tabbalk ----- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 4px)}
#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:calc(15px*var(--fst));padding:4px 0;min-height:56px}
#tabs button.on{color:var(--accent);font-weight:600}
#tabs .add .plus{background:var(--brand);color:#fff;width:52px;height:52px;border-radius:50%;margin-top:-20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.28)}
#tabs .add{color:var(--muted)}

/* ----- zoek, filters, tegels ----- */
.zoek{position:relative;margin:6px 0 10px}
.zoek svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.zoek input{padding-left:40px;border-radius:14px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;min-width:0}
.tile b.lg{font-size:calc(21px*var(--fs))!important;padding-top:.15em}
.tile b{display:block;font-size:calc(28px*var(--fs));line-height:1.1;letter-spacing:-.01em}
.tile small{display:block;font-size:calc(16px*var(--fs));color:var(--muted);margin-top:2px;line-height:1.15}
.tile.idle b{color:var(--idle)}.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.tile.info b{color:var(--info)}.tile.warn b{color:var(--warn)}.tile[data-go]{cursor:pointer}.gk{scroll-margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:0 18px;min-height:44px;font-size:calc(18px*var(--fs))}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips select{flex:none;width:auto;min-height:44px;padding:0 34px 0 14px;border-radius:24px;font-size:calc(18px*var(--fs));background:var(--card)}
.kzl{font-size:calc(16px*var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 2px 6px}.chips.w{flex-wrap:wrap;overflow:visible;padding-bottom:2px}.kzx{font-size:calc(16px*var(--fs));color:var(--muted);margin-top:3px}.kzh{font-size:calc(17px*var(--fs));color:var(--muted);margin:6px 2px}.kzbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 2px}.kzbar b{font-size:calc(18px*var(--fs))}.kzbar .knop{width:auto;margin:0;padding:12px 20px;font-size:calc(18px*var(--fs))}.kzp{border:2px solid var(--brand);border-radius:18px;padding:3px;margin:8px 0 4px}.kzw{background:none;border:0;color:var(--accent);font-size:calc(18px*var(--fs));padding:10px 2px}
.gk{font-size:calc(17px*var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 8px}
.leeg{text-align:center;color:var(--muted);padding:50px 20px}

/* ----- kaarten ----- */
.card{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px 12px 18px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc,#999)}
.card.sel{outline:2px solid var(--accent)}
.card:active{opacity:.85}
.thumb{flex:none;width:58px;height:76px;border-radius:8px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}.thumb svg{width:24px;height:30px;stroke-width:1.6}
.cm{flex:1;min-width:0}
.cn{font-weight:700;font-size:calc(20px*var(--fs));line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cp{color:var(--muted);font-size:calc(18px*var(--fs));margin-top:2px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs{color:var(--muted);font-size:calc(17px*var(--fs));margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.pil{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 12px;border-radius:16px;background:var(--cb);color:var(--c);font-size:calc(17px*var(--fs));font-weight:700;max-width:100%;line-height:1.2}.pil i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cnt{flex:none;text-align:center;min-width:56px}.cnt .vk{display:block;margin-top:4px;font-size:calc(16px*var(--fs));color:var(--muted);white-space:nowrap}
.cnt b{display:block;font-size:calc(30px*var(--fs));line-height:1;letter-spacing:-.02em}
.cnt small{font-size:calc(16px*var(--fs));color:var(--muted)}
.cnt.nul b{color:var(--muted);font-weight:500}
.dbar{margin-top:9px}
.dbar .tr{position:relative;height:10px;border-radius:5px;background:var(--soft)}
.dbar .fl{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--c)}
.dbar .mk{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;background:var(--text);border-radius:2px}
.dbar .lb{display:grid;grid-template-columns:1fr auto 1fr;font-size:calc(17px*var(--fs));font-weight:700;color:var(--muted);margin-top:10px;align-items:baseline}
.dbar .lb em{font-style:normal;font-weight:700;color:var(--c)}
.dbar .lb span:last-child{text-align:right}.dbar.gr{margin-top:34px}.dbar .nl{position:absolute;top:-30px;transform:translateX(-50%);font-size:calc(16px*var(--fs));font-weight:700;color:var(--text);white-space:nowrap}
.dbk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:calc(16px*var(--fs));color:var(--muted)}.dbk>span{flex:none;min-width:34px}.dbk>span:last-child{text-align:right}.dbk .tr{position:relative;flex:1;height:8px;border-radius:4px;background:var(--soft)}.dbk .fl{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--c)}.dbk .mk{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;background:var(--text);border-radius:2px}

/* ----- overlay / detail ----- */
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#ov.open{display:block;animation:inschuif .2s ease-out}
@keyframes inschuif{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
.ovh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ovh h2{flex:1;margin:0;font-size:calc(18px*var(--fs));text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:none;border:0;color:var(--accent);font-size:calc(18px*var(--fs));padding:8px 10px;min-width:64px;display:flex;align-items:center;gap:2px}
.tb.r{justify-content:flex-end;font-weight:600}
.ovb{padding:14px 16px calc(env(safe-area-inset-bottom) + 30px);max-width:680px;margin:0 auto}
.det h3{margin:14px 0 0;font-size:calc(28px*var(--fs));line-height:1.15;letter-spacing:-.015em}
.det .p{color:var(--muted);font-size:calc(18px*var(--fs));margin:3px 0 4px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.fact{font-size:calc(17px*var(--fs));padding:5px 12px;border-radius:14px;background:var(--soft);display:flex;align-items:center;gap:6px}
.fact i{width:9px;height:9px;border-radius:50%;background:var(--tc,#999)}
.foto{width:100%;aspect-ratio:93/44;border-radius:14px;background:var(--soft) center/cover no-repeat;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:10px}
.foto.big{border-style:solid}
.dv{border-radius:16px;padding:14px 14px 12px;margin-top:14px;background:var(--cb);color:var(--c)}
.dv .lb{font-size:calc(16px*var(--fs));font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85;text-align:center}
.dv .jr{font-size:calc(34px*var(--fs));font-weight:800;text-align:center;margin:2px 0;letter-spacing:-.01em}
.dv .tx{font-size:calc(18px*var(--fs));font-weight:700;text-align:center}
.dv .dbar .tr{background:rgba(127,127,127,.22)}
.bron{margin:6px 4px 0}
.klein{font-size:calc(17px*var(--fs));color:var(--muted);line-height:1.4}
.voorraad{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.voorraad .a{flex:1;text-align:center;font-size:calc(36px*var(--fs));font-weight:700;color:var(--accent);line-height:1}
.voorraad .a small{display:block;font-size:calc(16px*var(--fs));font-weight:500;color:var(--muted);margin-top:3px}
.pm{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--accent);font-size:calc(28px*var(--fs))}
.pm:active{opacity:.6}
.scores{display:flex;gap:8px;margin-top:12px}
.scores div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center}
.scores b{display:block;font-size:calc(26px*var(--fs));color:var(--accent)}
.scores small{font-size:calc(16px*var(--fs));color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gt{font-size:calc(17px*var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 6px}
.rijen{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.rijen div{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rijen div:last-child{border:0}
.rijen b{font-size:calc(14px*var(--fs));font-weight:600;color:var(--muted)}
.rijen span{min-width:0;overflow-wrap:anywhere;font-size:calc(18px*var(--fs));line-height:1.3}
.knop{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:calc(18px*var(--fs));font-weight:600;background:var(--brand);color:#fff;margin-top:14px}
.knop.sec{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.knop:disabled{opacity:.5}
.link-bad{display:block;margin:26px auto 4px;background:none;border:0;color:var(--bad);font-size:calc(18px*var(--fs));padding:12px}
.rij2{display:flex;gap:10px}.rij2>*{flex:1}
#pane .ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}
.ptb{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 14px 6px;background:var(--bg)}

/* ----- formulier ----- */
label{display:block;font-size:calc(17px*var(--fs));font-weight:600;color:var(--muted);margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:calc(18px*var(--fs));min-height:52px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 54%,calc(100% - 13px) 54%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:76px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:16px 16px;font-size:calc(18px*var(--fs));font-weight:650;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec .in{padding:0 16px 16px}
details.sec .in label:first-child{margin-top:0}
.lookup{border-color:var(--accent)}
.lookup summary{color:var(--accent)}
.savebar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.savebar .knop{margin:0}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#2a2223;color:#fff;padding:12px 16px;border-radius:14px;font-size:calc(18px*var(--fs));z-index:50;display:none;align-items:center;gap:14px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#ffb3bf;font-weight:700;font-size:calc(18px*var(--fs));padding:6px}

/* ----- iPad / Mac: lijst links, wijn rechts ----- */
@media(min-width:900px){
  #tabs{top:0;right:auto;bottom:0;width:88px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 16px) 6px 16px}
  #tabs button{min-height:58px}
  #tabs .add .plus{margin-top:0;width:44px;height:44px}
  #app{margin-left:88px;padding-bottom:0;display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:100vh}
  .master{overflow-y:auto;height:100vh;border-right:1px solid var(--line)}
  #pane{display:block;overflow-y:auto;height:100vh}
  #ov{left:88px}
  .wrap{padding:0 18px}
  #toast{bottom:24px;left:calc(50% + 44px)}
}

#crop{position:fixed;inset:0;background:#141010;z-index:60;color:#fff;display:flex;flex-direction:column;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
#crop .crh{width:100%;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}
#crop .crh button{background:none;border:0;color:#fff;font-size:calc(18px*var(--fs));padding:6px 4px}
#crop .crh #cOK{font-weight:700;color:#ffb3bf}
#crop .crw{margin:18px 0 6px}
#crop canvas{display:block;touch-action:none;border:2px solid #fff;border-radius:4px;background:#fff}
#crop .crc{width:100%;max-width:640px;padding:10px 20px}
#crop input[type=range]{width:100%;padding:0;border:0;background:none}
#crop .rij2 button{background:#2b2222;color:#fff;border:1px solid #4a3c3c;border-radius:10px;padding:11px;font-size:calc(17px*var(--fs))}
#crop label{text-transform:none;letter-spacing:0;font-size:calc(17px*var(--fs));color:#fff;margin:6px 0 4px;display:flex;align-items:center;gap:8px}

#crop .klein{color:#b9aaa6;margin-top:10px;text-align:center}
/* ---------- ETIKET (103 x 164 mm, DK-11247) ---------- */
#printArea{display:none}
.lbl{width:100%;height:157mm;padding:4mm 5mm;font-family:Arial,Helvetica,sans-serif;color:#000;overflow:hidden;background:#fff}
.lbl .in{transform-origin:top left}
.lbl .g td.sm{font-size:8.5pt}
.lbl .g td.xs{font-size:7.5pt}
.lbl .t1{font-size:17pt;font-weight:700;text-align:center;line-height:1.15}
.lbl .t2{font-size:14pt;font-weight:700;text-align:center;line-height:1.15;margin-top:1mm}
.lbl .ft{height:52mm;margin:3mm 0 3mm;border:.4mm solid #000;background:#fff center/cover no-repeat}
.lbl table{border-collapse:collapse;width:100%;table-layout:fixed}
.lbl .g td{border:.4mm solid #000;text-align:center;vertical-align:middle;padding:1.3mm 1mm;height:9.5mm;font-size:11pt;line-height:1.15;overflow:hidden;word-wrap:break-word}
.lbl .g tr:first-child td,.lbl .g td.b{font-weight:700;font-size:13pt}
.lbl .i{margin-top:3mm}
.lbl .i td{border:.3mm solid #000;padding:1.3mm 1.6mm;vertical-align:middle;font-size:10.5pt;line-height:1.15;height:8mm}
.lbl .i td.k{width:27mm;font-size:6.5pt;font-weight:700;text-transform:uppercase}
.lbl .dvl{margin-top:2.5mm;border:.5mm solid #000;padding:1.5mm 2mm;display:flex;align-items:center;justify-content:space-between}
.lbl .dvl b{font-size:7pt;text-transform:uppercase}
.lbl .dvl span{font-size:16pt;font-weight:700}
.lbl .kv{margin-top:2mm}
.lbl .kv b{display:block;font-size:6.5pt;text-transform:uppercase}
.lbl .kv span{display:block;font-size:10pt;min-height:4mm;line-height:1.2}
@media print{
  @page{size:103mm 164mm;margin:0}
  html,body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;width:103mm;height:157mm;overflow:hidden;break-after:avoid;page-break-after:avoid}
}
details.sec .in label{margin-top:14px}details.sec .in>label:first-child,details.sec .in .rij>div>label{margin-top:0}details.sec .in .rij{margin-top:14px}.tile b{white-space:nowrap}
.rv{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:calc(18px*var(--fs))}.rv .oud{color:var(--muted,#8f8384);margin-top:2px}.rv .nieuw{margin-top:2px}.rvb{display:flex;gap:8px;margin-top:8px}.rvb button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:600;font-size:calc(18px*var(--fs))}

<body>

      <p class="klein" style="margin-top:16px">Alle gegevens staan in je Google Sheet (tabblad “Wijnen”). Download als Excel via Bestand → Downloaden → Microsoft Excel.</p>

<script>
// ===================== CONFIG =====================
const DEFAULT_URL = '';   // optioneel: plak hier je Apps Script web-app URL
const F = [
  {k:'naam',l:'Naam wijn',req:1,ph:'Valpolicella Ripasso Superiore'},
  {k:'producent',l:'Producent / subtitel',ph:'Ville di Antanè'},
  {k:'jaar',l:'Jaargang',half:1,ph:'2022'},
  {k:'type',l:'Type',half:1,sel:['Rood','Wit','Rosé','Bubbels','Oranje','Dessert']},
  {k:'stijl',l:'Stijl',half:1,sel:['Stil','Mousserend','Parelend','Versterkt']},
  {k:'aantal',l:'Aantal flessen',half:1,num:1,def:1},
  {k:'prijs',l:'Prijs per fles (€)',half:1,im:'decimal',ph:'14,95'},
  {k:'land',l:'Land',half:1,ph:'Italië'},
  {k:'regio',l:'Regio',half:1,ph:'Veneto'},
  {k:'druiven',l:'Druiven',ph:'Corvina, Corvinone & Rondinella'},
  {k:'vak',l:'Vak (plek in kelder)',half:1,ph:'Vak 1A'},
  {k:'aankoop',l:'Aankoopdatum',half:1,ph:'Nov 2026'},
  {k:'gekochtbij',l:'Gekocht bij',ph:'Rik de Jong'},
  {k:'smaak',l:'Smaakprofiel',ph:'Vol en zacht'},
  {k:'body',l:'Body',sel:['Licht','Middel','Vol']},
  {k:'alcohol',l:'Alcohol (%)',half:1,im:'decimal',ph:'13,5'},
  {k:'serveertemp',l:'Serveertemperatuur',half:1,ph:'16–18 °C'},
  {k:'decanteren',l:'Decanteren',sel:['Nee','Ja, 30 min','Ja, 1 uur','Ja, 2 uur of langer','Karaf ter beluchting']},
  {k:'drinkmoment',l:'Drinkmoment',ph:'Weekend, Bij het eten',list:['Dagelijks','Weekend','Bij het eten','Bijzonder diner','Feest','Aperitief','Cadeau']},
  {k:'eten',l:'Eetcombinatie',ph:'Rood vlees, kaas (begin met een groep uit Kiezen)'},
  {k:'drinkvanaf',l:'Drinken vanaf (jaar)',half:1,im:'numeric',ph:'2026'},
  {k:'drinktot',l:'Drinken tot (jaar)',half:1,im:'numeric',ph:'2032'},
  {k:'drinkbron',l:'Bron drinkvenster',ph:'Gevonden: perfectewijn.nl'},
  {k:'score',l:'Eigen score',half:1,im:'decimal',ph:'90'},
  {k:'vivino',l:'Vivino score',half:1,im:'decimal',ph:'4,1'},
  {k:'parker',l:'Parker score',half:1,im:'decimal',ph:'93'},
  {k:'opmerkingen',l:'Opmerkingen',area:1}
];
const GROEPEN = [
  ['Wijn', ['naam','producent','jaar','type','stijl'], 1],
  ['Herkomst', ['land','regio','druiven']],
  ['Voorraad & aankoop', ['aantal','prijs','vak','aankoop','gekochtbij'], 1],
  ['Proeven & drinkvenster', ['smaak','body','alcohol','serveertemp','decanteren','drinkmoment','eten','drinkvanaf','drinktot','drinkbron','opmerkingen']],
  ['Scores', ['score','vivino','parker']]
];
const DET = [
  ['Herkomst', ['land','regio','druiven']],
  ['Aankoop & plek', ['vak','aankoop','gekochtbij','prijs']],
  ['Proeven', ['smaak','body','alcohol','serveertemp','decanteren','drinkmoment','eten','opmerkingen']]
];
const LBL = {naam:'Naam',producent:'Producent',jaar:'Jaar',type:'Type',stijl:'Stijl',land:'Land',regio:'Regio',druiven:'Druiven',vak:'Vak',aankoop:'Aankoop',gekochtbij:'Gekocht bij',smaak:'Smaakprofiel',body:'Body',alcohol:'Alcohol',serveertemp:'Serveertemperatuur',decanteren:'Decanteren',drinkmoment:'Drinkmoment',eten:'Eetcombinatie',drinkvanaf:'Drinken vanaf',drinktot:'Drinken tot',drinkbron:'Bron drinkvenster',drinkvenster:'Drinkvenster',prijs:'Prijs per fles',score:'Eigen score',vivino:'Vivino',parker:'Parker',opmerkingen:'Opmerkingen'};
const TCOL = {Rood:'#8a2432',Wit:'#c9bb4f',Rosé:'#e58fa0',Bubbels:'#d9a94a',Oranje:'#dc7a31',Dessert:'#a86b2c'};
const tcol = w => TCOL[w.type] || '#8f8384';
const IC = {
  kelder:'<path d="M8 2h8l1 7a5 5 0 0 1-10 0z"/><path d="M12 14v8M8 22h8"/>',
  drink:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  kies:'<path d="M7 3v7a2 2 0 0 0 4 0V3M9 3v18"/><path d="M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/>',
  instel:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

// ===================== STATE =====================
let cfg = JSON.parse(localStorage.getItem('wijn_cfg') || '{}');
if(!cfg.url) cfg.url = DEFAULT_URL;
let wines = JSON.parse(localStorage.getItem('wijn_cache') || '[]');
let q = '', filter = 'Alle', alleenVoorraad = false, sorteer = 'naam', tab = 'kelder', selId = null, fotoData = null, lastSync = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fotoUrl = id => id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000' : '';
const wide = () => window.matchMedia('(min-width:900px)').matches;
function toast(m, ms=2200, act){
  const t = $('#toast'); t.innerHTML = `<span>${esc(m)}</span>` + (act ? `<button>${esc(act.label)}</button>` : '');
  t.style.display = 'flex';
  if(act) t.querySelector('button').onclick = () => { t.style.display = 'none'; act.fn(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms);
}

// ===================== DRINKVENSTER =====================
const NU = new Date().getFullYear();
function venster(w){
  let a = parseInt(w.drinkvanaf), t = parseInt(w.drinktot);
  if(!a && !t){ const m = String(w.drinkvenster||'').match(/(\d{4})\D+(\d{4})/); if(m){ a = +m[1]; t = +m[2]; } }
  a = a || 0; t = t || 0;
  let st = null, txt = '';
  if(a || t){
    if(t && NU > t){ st = 'over'; txt = 'Over datum'; }
    else if(t && NU >= t - 1){ st = 'laatste'; txt = NU === t ? 'Direct drinken: laatste jaar' : 'Direct drinken'; }
    else if(a && NU < a){ st = 'bewaren'; txt = 'Nog laten liggen'; }
    else if(a && t && t - a >= 3 && (NU - a) / (t - a) < 0.34){ st = 'beter'; txt = 'Wordt nog beter'; }
    else if(a && t){ st = 'piek'; txt = 'Op dronk'; }
    else { st = 'nu'; txt = 'Nu drinken'; }
  }
  return {a, t, st, txt, tekst: a && t ? a + ' – ' + t : a ? 'vanaf ' + a : t ? 'tot ' + t : ''};
}
// Tijdlijn: gekleurd = drinkvenster, streepje = dit jaar
function dbar(v, zonderTekst){
  if(!v.st) return '';
  const a = v.a, t = v.t, min = (a || t - 4) - 1, max = (t || a + 4) + 1;
  const pct = x => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
  const f0 = pct(a || min), f1 = pct(t || max);
  const nl = zonderTekst ? `<div class="nl" style="left:${Math.min(88, Math.max(12, pct(NU)))}%">nu ${NU}</div>` : '';
  return `<div class="dbar st-${v.st}${zonderTekst ? ' gr' : ''}"><div class="tr"><div class="fl" style="left:${f0}%;width:${Math.max(2, f1 - f0)}%"></div><div class="mk" style="left:${pct(NU)}%"></div>${nl}</div>
    <div class="lb"><span>${a || ''}</span><em>${zonderTekst ? '' : esc(v.txt)}</em><span>${t || ''}</span></div></div>`;
}

// Compacte tijdlijn op de kaart: jaartallen aan de zijkanten, streepje = dit jaar
function dbk(v){
  if(!v.st) return '';
  const a = v.a, t = v.t, min = (a || t - 4) - 1, max = (t || a + 4) + 1;
  const pct = x => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
  const f0 = pct(a || min), f1 = pct(t || max);
  return `<div class="dbk st-${v.st}" role="img" aria-label="Drinkvenster ${esc(v.tekst)}, nu ${NU}"><span>${a || ''}</span><div class="tr"><div class="fl" style="left:${f0}%;width:${Math.max(2, f1 - f0)}%"></div><div class="mk" style="left:${pct(NU)}%"></div></div><span>${t || ''}</span></div>`;
}

// ===================== API =====================
async function api(body){
  if(!cfg.url) throw new Error('Nog geen web-app URL ingesteld (Instellingen)');
  let r;
  if(!body){
    r = await fetch(cfg.url + '?action=list&token=' + encodeURIComponent(cfg.token || ''));
  } else {
    r = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, token: cfg.token || ''})});
  }
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Fout');
  return j;
}
async function laad(){
  try{
    const j = await api();
    wines = j.wijnen; lastSync = new Date();
    localStorage.setItem('wijn_cache', JSON.stringify(wines));
    $('#banner').innerHTML = '';
  }catch(e){
    $('#banner').innerHTML = '<div class="banner">Offline of niet verbonden: laatst bekende lijst. (' + esc(e.message) + ')</div>';
  }
  teken();
  if(wide() && selId){ const w = wines.find(x => x.id === selId); if(w) showPane(selId); }
}

// ===================== LIJSTEN =====================
const SORT = {
  naam: (a,b) => (a.naam||'').localeCompare(b.naam||'', 'nl'),
  drink: (a,b) => (venster(a).t || 9999) - (venster(b).t || 9999) || SORT.naam(a,b),
  jaar: (a,b) => (parseInt(b.jaar)||0) - (parseInt(a.jaar)||0) || SORT.naam(a,b),
  voorraad: (a,b) => (b.aantal||0) - (a.aantal||0) || SORT.naam(a,b)
};
function cardHTML(w, extra){
  const v = venster(w), op = w.aantal > 0;
  const sub = [w.producent, w.jaar].filter(Boolean).map(esc).join(' · ');
  const pil = op && v.st ? `<span class="pil st-${v.st}"><i></i>${esc(v.txt)}</span>` : '';
  const rest = pil ? '' : [w.type, w.regio || w.land, w.vak].filter(Boolean).map(esc).join(' · ');
  const foto = w.fotoId ? `<div class="thumb" style="background-image:url('${fotoUrl(w.fotoId).replace('w1000','w200')}')"></div>`
    : `<div class="thumb" aria-hidden="true"><svg class="i" viewBox="0 0 22 30"><path d="M8 2h6v6l3 5v14H5V13l3-5z"/><path d="M5 18h12"/></svg></div>`;
  return `<div class="card ${selId === w.id && wide() ? 'sel' : ''}" data-id="${esc(w.id)}" style="--tc:${tcol(w)}">
    ${foto}
    <div class="cm"><div class="cn">${esc(w.naam)}</div>${sub ? `<div class="cp">${sub}</div>` : ''}${pil || rest ? `<div class="cs">${pil}${rest ? `<span>${rest}</span>` : ''}</div>` : ''}${extra || ''}${op ? dbk(v) : ''}</div>
    <div class="cnt ${w.aantal > 0 ? '' : 'nul'}"><b>${w.aantal||0}</b><small>${(w.aantal||0) === 1 ? 'fles' : 'flessen'}</small>${pil && w.vak ? `<small class="vk">${esc(w.vak)}</small>` : ''}</div>
  </div>`;
}
function teken(){ tekenKelder(); tekenDrink(); tekenKies(); }
function tekenKelder(){
  const hoofd = ['Rood','Wit','Rosé','Bubbels'], qq = q.toLowerCase().trim();
  let l = wines.filter(w =>
    (filter === 'Alle' || (filter === 'Overig' ? !hoofd.includes(w.type) : w.type === filter)) &&
    (!alleenVoorraad || w.aantal > 0) &&
    (!qq || F.some(f => String(w[f.k]||'').toLowerCase().includes(qq))));
  l.sort(SORT[sorteer]);
  const op = wines.filter(w => w.aantal > 0);
  const fl = op.reduce((s,w) => s + (w.aantal||0), 0);
  const tel = (...k) => op.filter(w => k.includes(venster(w).st)).length;
  const nPiek = tel('piek','nu'), nBeter = tel('beter'), nBew = tel('bewaren'), aand = tel('laatste','over');
  const waarde = op.reduce((s,w) => { const p = parseFloat(String(w.prijs||'').replace(',', '.')); return s + (isNaN(p) ? 0 : p * (w.aantal||0)); }, 0);
  $('#sub').textContent = wines.length + ' wijnen' + (lastSync ? ' · bijgewerkt ' + lastSync.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'}) : '');
  $('#stats').innerHTML = wines.length ? `
    <div class="tile"><b>${fl}</b><small>flessen</small></div>
    <div class="tile ${aand ? 'bad' : ''}" data-go="drink" data-sec="${tel('over') && !tel('laatste') ? 'over' : 'laatste'}"><b>${aand}</b><small>aandacht</small></div>
    <div class="tile ok" data-go="drink" data-sec="piek"><b>${nPiek}</b><small>op dronk</small></div>
    <div class="tile info" data-go="drink" data-sec="beter"><b>${nBeter}</b><small>wordt beter</small></div>
    <div class="tile idle" data-go="drink" data-sec="bewaren"><b>${nBew}</b><small>laten liggen</small></div>
    <div class="tile"><b${waarde > 0 ? ' class="lg"' : ''}>${waarde > 0 ? '€ ' + Math.round(waarde) : wines.length}</b><small>${waarde > 0 ? 'waarde' : 'wijnen'}</small></div>` : '';
  $('#chips').innerHTML = ['Alle','Rood','Wit','Rosé','Bubbels','Overig'].map(t => `<button class="chip ${filter === t ? 'on' : ''}" data-f="${t}">${t}</button>`).join('')
    + `<button class="chip ${alleenVoorraad ? 'on' : ''}" data-v="1">Op voorraad</button>`
    + `<select id="sort" aria-label="Sorteren"><option value="naam">Sorteer: naam</option><option value="drink">Sorteer: drink eerst</option><option value="jaar">Sorteer: jaargang</option><option value="voorraad">Sorteer: voorraad</option></select>`;
  $('#sort').value = sorteer;
  $('#lijst').innerHTML = l.length ? l.map(w => cardHTML(w)).join('') : `<div class="leeg">${wines.length ? 'Niets gevonden.' : 'Nog geen wijnen. Tik op ＋ om te beginnen.'}</div>`;
}
const DSEC = [['over','Over datum: proeven','Over datum'],['laatste','Direct drinken','Direct'],['piek','Op dronk','Op dronk'],['nu','Nu drinken (einde onbekend)','Nu drinken'],['beter','Wordt nog beter','Wordt beter'],['bewaren','Nog laten liggen','Laten liggen'],['geen','Zonder drinkvenster','Geen venster']];
function tekenDrink(){
  const op = wines.filter(w => w.aantal > 0);
  const g = {}; DSEC.forEach(([k]) => g[k] = []);
  op.forEach(w => { g[venster(w).st || 'geen'].push(w); });
  Object.values(g).forEach(a => a.sort(SORT.drink));
  const sec = (k, t, a) => a.length ? `<div class="gk" id="sec_${k}">${t} (${a.length})</div>` + a.map(w => cardHTML(w)).join('') : '';
  $('#dchips').innerHTML = DSEC.filter(([k]) => g[k].length).map(([k,,kort]) => `<button class="chip" data-sec="${k}">${kort} ${g[k].length}</button>`).join('');
  $('#dlijst').innerHTML = op.length
    ? DSEC.map(([k,t]) => sec(k, t, g[k])).join('')
    : '<div class="leeg">Geen wijnen op voorraad.</div>';
}
function naarSec(k){ const el = document.getElementById('sec_' + k); if(el) el.scrollIntoView({block:'start'}); }
document.addEventListener('click', e => {
  const kc = e.target.closest('#v_kies .chip[data-g]'); if(kc){ kzToggle(kc.dataset.g, kc.dataset.v); return; }
  if(e.target.closest('#kzPick')){ kzKies(); return; }
  if(e.target.closest('#kzWis')){ kzWis(); return; }
  const c = e.target.closest('.card'); if(c){ toonDetail(c.dataset.id); return; }
  const t = e.target.closest('.tile[data-go]'); if(t){ setTab(t.dataset.go); if(t.dataset.sec) setTimeout(() => naarSec(t.dataset.sec), 30); return; }
  const dc = e.target.closest('#dchips .chip'); if(dc){ naarSec(dc.dataset.sec); return; }
  const b = e.target.closest('#chips .chip'); if(b){ if(b.dataset.v) alleenVoorraad = !alleenVoorraad; else filter = b.dataset.f; tekenKelder(); }
});
document.addEventListener('change', e => { if(e.target.id === 'sort'){ sorteer = e.target.value; tekenKelder(); } });
$('#zoek').addEventListener('input', e => { q = e.target.value; tekenKelder(); });
$('#bRef').onclick = () => { laad(); toast('Verversen …', 1200); };


// ===================== KIEZEN =====================
const KZ_ETEN = [
  ['Rood vlees',['rood vlees','rund','biefstuk','entrec','steak','ribeye','ossenhaas','stoof','gebraad','hamburger','daube','carpaccio']],
  ['Lam & wild',['lam','wild','hert','ree','konijn','fazant','everzwijn','gibier']],

// Body: eigen veld; ontbreekt die, dan een grove afleiding uit alcohol % en smaakprofiel
function bodyVan(w){
  if(['Licht','Middel','Vol'].includes(w.body)) return w.body;   // eigen/bron-invoer gaat voor
  const alc = parseFloat(String(w.alcohol||'').replace(',', '.')), t = String(w.smaak||'').toLowerCase();
  if(!alc && !t) return null;
  if(/(^|[^a-z])(vol|volle|krachtig|stevig|rijk|geconcentreerd|intens|zwaar|machtig)/.test(t) || alc >= 14) return 'Vol';
  if(/(^|[^a-z])(licht|delicaat|sprankel|knisper)/.test(t) || (alc && alc <= 12.5)) return 'Licht';
  return 'Middel';
}

function kzLijst(negeerStatus){

    if(kz.eten.size && ![...kz.eten].some(k => kzHit(eten, KZ_ETEN.find(x => x[0] === k)[1]))) return false;
    if(kz.mom.size && ![...kz.mom].some(k => kzHit(mom, KZ_MOM.find(x => x[0] === k)[1]))) return false;
    if(kz.type.size && !kz.type.has(w.type)) return false;

function lkClean(v){
  if(v === null || v === undefined) return '';
  if(Array.isArray(v)) v = v.map(x => (x && typeof x === 'object') ? '' : x).filter(Boolean).join(', ');
  if(typeof v === 'object') return '';
  let s = String(v).replace(/<\/?cite[^>]*>/gi, '').replace(/\[\d+(?:[,\s-]+\d+)*\]/g, '').replace(/【[^】]*】/g, '').replace(/\*\*|__/g, '').replace(/\s+/g, ' ').trim();
  s = s.replace(/^["'“”‘’]+|["'“”‘’]+$/g, '').trim();
  if(/^(n\/?a|n\.?v\.?t\.?|onbekend|unknown|null|undefined|none|geen|-+|\?+|niet gevonden|not found)$/i.test(s)) return '';
  return s;
}
// Eén getal uit tekst. Meerdere getallen (behalve de eerste-optie) = dubbelzinnig = null.
function lkGetal(v, eerste){
  const s = String(v).replace(/[–—]/g, '-');
  const m = s.match(/\d+(?:[.,]\d+)?/g);
  if(!m) return null;
  if(m.length > 1 && (!eerste || /\d\s*(?:-|\/|tot|to)\s*\d/i.test(s))) return null;
  return parseFloat(m[0].replace(',', '.'));
}
const lkKomma = s => String(s).replace('.', ',');
function lkJaar(v, min, max){
  const m = String(v).match(/\b(19|20)\d{2}\b/); if(!m) return null;
  const y = +m[0]; return y >= min && y <= max ? String(y) : null;
}
function lkTemp(v){
  const s = String(v).replace(/[–—]/g, '-');
  let a, b, m = s.match(/(\d{1,2})\s*(?:°\s*c?)?\s*(?:-|tot|to)\s*(\d{1,2})\s*(?:°|graden|c\b)/i);
  if(m){ a = +m[1]; b = +m[2]; }
  else if((m = s.match(/(\d{1,2})\s*(?:-|tot|to)\s*(\d{1,2})(?!\d)/i)) && !/min|uur/i.test(s)){ a = +m[1]; b = +m[2]; }
  else if((m = s.match(/(\d{1,2})\s*(?:°|graden)/i))){ a = +m[1]; }
  else return null;
  if(b !== undefined && a > b){ const t = a; a = b; b = t; }
  if(a < 3 || (b !== undefined ? b : a) > 25) return null;
  return b !== undefined && b !== a ? a + '-' + b + ' °C' : a + ' °C';
}
function lkDecant(v){
  const s = String(v).toLowerCase().trim();
  const ex = LK_DECANT.find(o => o.toLowerCase() === s); if(ex) return ex;
  if(/^(nee|no|niet|geen)\b/.test(s)) return 'Nee';
  const u = s.match(/(\d+(?:[.,]\d+)?)\s*(uur|u\b|h\b|hours?|hrs?|min)/);
  if(u){ const n = parseFloat(u[1].replace(',', '.')), min = /min/.test(u[2]) ? n : n * 60; return min <= 45 ? 'Ja, 30 min' : min <= 90 ? 'Ja, 1 uur' : 'Ja, 2 uur of langer'; }
  if(/karaf|carafe|beluchten|aerat|decant/.test(s)) return 'Karaf ter beluchting';
  return null;
}
function lkSelect(k, v){

function lkMoment(v){
  const delen = String(v).split(/[,;|]|\sen\s|\s&\s/i).map(x => x.trim().toLowerCase()).filter(Boolean);
  return LK_MOMENT.filter(o => delen.includes(o.toLowerCase())).join(', ');
}
function lkEten(v){
  let t = String(v).replace(/\s+/g, ' ').trim();
  LK_ETEN.forEach(g => { t = t.replace(new RegExp(g.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'), 'i'), g); });
  return {tekst: t, begint: LK_ETEN.some(g => t.toLowerCase().startsWith(g.toLowerCase())), woorden: t.split(/\s+/).length};
}
function lkBron(v, heeftJaren){
  const s = lkClean(v);
  if(!s) return heeftJaren ? 'Inschatting: bron niet opgegeven' : '';
  const m = s.match(/^(gevonden|inschatting)\s*[:\-–]\s*(.*)$/i);
  if(m){
    const soort = m[1].toLowerCase() === 'gevonden' ? 'Gevonden' : 'Inschatting', rest = m[2].trim();
    if(soort === 'Gevonden' && rest.length < 4) return 'Inschatting: bron niet opgegeven';
    return soort + ': ' + rest;
  }
  return 'Inschatting: ' + s;
}

// Zet het ruwe Claude-antwoord om in schone, gevalideerde waarden.
function lkNormaliseer(o, ctx){
  const W = [], vals = {}, jaarNu = ctx.jaarNu;
  const ak = k => { k = String(k).trim().toLowerCase(); return LK_ALIAS[k] || k; };
  const raw = {}; Object.keys(o || {}).forEach(k => { if(!(ak(k) in raw)) raw[ak(k)] = o[k]; });
  if('drinkvenster_bron' in raw && !('drinkbron' in raw)) raw.drinkbron = raw.drinkvenster_bron;
  const put = (k, v) => { if(v) vals[k] = v; };
  const warn = (k, t) => W.push((ctx.lbl && ctx.lbl[k] || k) + ': ' + t);

  const h = String(raw.herkenning || '').toLowerCase();
  const herkenning = /onzeker/.test(h) ? 'onzeker' : /waarschijnlijk/.test(h) ? 'waarschijnlijk' : 'zeker';

  ['naam','producent','regio','druiven','opmerkingen'].forEach(k => { const s = lkClean(raw[k]); if(s) put(k, k === 'opmerkingen' ? s.slice(0, 400) : s); });
  if(raw.jaar !== undefined && lkClean(raw.jaar)){ const y = lkJaar(raw.jaar, 1900, jaarNu + 1); y ? put('jaar', y) : warn('jaar', 'onbruikbaar, genegeerd (' + lkClean(raw.jaar) + ')'); }
  if(lkClean(raw.land)){ const s = lkClean(raw.land); put('land', LK_LAND[s.toLowerCase()] || s); }
  ['type','stijl','body'].forEach(k => { const s = lkClean(raw[k]); if(!s) return; const r = lkSelect(k, s); r ? put(k, r) : warn(k, '"' + s + '" niet herkend, genegeerd'); });
  if(lkClean(raw.smaak)){ const w = lkClean(raw.smaak).replace(/[.;]+$/, '').split(/\s+/); if(w.length > 4) warn('smaak', 'ingekort tot 4 woorden'); put('smaak', w.slice(0, 4).join(' ').replace(/(?:\s+(?:en|of|met|and|&))?,?$/i, '')); }
  if(lkClean(raw.drinkmoment)){ const r = lkMoment(raw.drinkmoment); r ? put('drinkmoment', r) : warn('drinkmoment', 'geen woord uit de vaste lijst, genegeerd'); }
  if(lkClean(raw.eten)){ const e = lkEten(lkClean(raw.eten)); put('eten', e.tekst); if(!e.begint) warn('eten', 'begint niet met een vaste groep; de Kiezen-tab vindt deze wijn dan mogelijk niet'); if(e.woorden > 8) warn('eten', 'langer dan 8 woorden'); }
  if(lkClean(raw.alcohol)){ const n = lkGetal(lkClean(raw.alcohol)); (n !== null && n >= 5 && n <= 25) ? put('alcohol', lkKomma(+n.toFixed(2))) : warn('alcohol', '"' + lkClean(raw.alcohol) + '" onduidelijk of onwaarschijnlijk, genegeerd'); }
  if(lkClean(raw.serveertemp)){ const t = lkTemp(lkClean(raw.serveertemp)); t ? put('serveertemp', t) : warn('serveertemp', '"' + lkClean(raw.serveertemp) + '" niet te lezen, genegeerd'); }
  if(lkClean(raw.decanteren)){ const d = lkDecant(lkClean(raw.decanteren)); d ? put('decanteren', d) : warn('decanteren', '"' + lkClean(raw.decanteren) + '" niet herkend, genegeerd'); }
  if(lkClean(raw.vivino)){ const n = lkGetal(lkClean(raw.vivino), true); (n !== null && n >= 1 && n <= 5) ? put('vivino', lkKomma((Math.round(n * 10) / 10).toFixed(1))) : warn('vivino', 'onwaarschijnlijk, genegeerd'); }
  if(lkClean(raw.parker)){ const n = lkGetal(lkClean(raw.parker), true); (n !== null && n >= 50 && n <= 100) ? put('parker', String(Math.round(n))) : warn('parker', 'onwaarschijnlijk, genegeerd'); }
  if(lkClean(raw.prijs)){ const n = lkGetal(lkClean(raw.prijs)); (n !== null && n > 0 && n < 5000) ? put('prijs', lkKomma(Number.isInteger(n) ? String(n) : n.toFixed(2))) : warn('prijs', 'onduidelijk, genegeerd'); }

  // Drinkvenster: alles of niets, met controle op logica
  let va = lkClean(raw.drinkvanaf) ? lkJaar(raw.drinkvanaf, 1950, jaarNu + 80) : null;
  let vt = lkClean(raw.drinktot) ? lkJaar(raw.drinktot, 1950, jaarNu + 80) : null;
  const jr = +(vals.jaar || ctx.jaarForm || 0);
  if(va && vt && +va > +vt){ warn('drinkvanaf', 'venster ' + va + '-' + vt + ' is omgekeerd, genegeerd'); va = vt = null; }
  if(jr && ((va && +va < jr) || (vt && +vt < jr))){ warn('drinkvanaf', 'venster ligt voor de jaargang, genegeerd'); va = vt = null; }
  if(va || vt){
    if(va) vals.drinkvanaf = va; if(vt) vals.drinktot = vt;
    const b = lkBron(raw.drinkbron, true); vals.drinkbron = b;
    if(!/^(gevonden|inschatting)/i.test(lkClean(raw.drinkbron))) warn('drinkbron', 'begon niet met Gevonden: of Inschatting:, daarom als Inschatting gemarkeerd');
  } else if(lkClean(raw.drinkbron) || lkClean(raw.drinkvanaf) || lkClean(raw.drinktot)){
    if(!W.some(x => /venster/.test(x))) warn('drinkbron', 'bron zonder bruikbare jaartallen, genegeerd');
  }

  // Bronnen en zekerheid per veld
  const bronnen = {}, zk = {}, nieuw = raw.bronnen && typeof raw.bronnen === 'object' && !Array.isArray(raw.bronnen);
  if(nieuw) Object.keys(raw.bronnen).forEach(k => { const s = lkClean(raw.bronnen[k]); if(s) bronnen[ak(k)] = s.slice(0, 90); });
  if(raw.zekerheid && typeof raw.zekerheid === 'object') Object.keys(raw.zekerheid).forEach(k => {
    const s = String(raw.zekerheid[k]).toLowerCase();
    const z = /hoog|high/.test(s) ? 'hoog' : /laag|low/.test(s) ? 'laag' : /middel|medium|mid/.test(s) ? 'middel' : '';
    if(z) zk[ak(k)] = z;
  });
  if(zk.drinkvenster){ ['drinkvanaf','drinktot','drinkbron'].forEach(k => { if(!zk[k]) zk[k] = zk.drinkvenster; }); }
  if(bronnen.drinkvenster){ ['drinkvanaf','drinktot'].forEach(k => { if(!bronnen[k]) bronnen[k] = bronnen.drinkvenster; }); }
  // Feiten zonder bron in een nieuw-formaat antwoord: laag vertrouwen
  if(nieuw) LK_FEITEN.forEach(k => { if(vals[k] && !bronnen[k]){ zk[k] = 'laag'; bronnen[k] = ''; } });
  const nietGevonden = (Array.isArray(raw.niet_gevonden) ? raw.niet_gevonden : []).map(x => ak(lkClean(x))).filter(Boolean);
  return {vals, bronnen, zk, herkenning, warn: W, nietGevonden, nieuwFormaat: nieuw};
}

// Voegt/vervangt de regel "Bronnen dd-mm-jjjj: veld: bron; veld: bron" in opmerkingen, zonder dubbelen.
function lkBronMerge(oud, ent, datum){
  oud = String(oud || '');
  const re = /(^|\s·\s)Bronnen \d{2}-\d{2}-\d{4}: ([^·]*?)(?=\s·\s|$)/;
  const m = oud.match(re), map = new Map();
  if(m) m[2].split(/;\s*/).forEach(p => { const i = p.indexOf(': '); if(i > 0) map.set(p.slice(0, i).trim(), p.slice(i + 2).trim()); });
  Object.keys(ent).forEach(k => { const v = String(ent[k]).replace(/[;·]/g, ',').replace(/\s+/g, ' ').trim().slice(0, 90); if(v) map.set(k, v); });
  if(!map.size) return oud;
  const seg = 'Bronnen ' + datum + ': ' + [...map].map(([k, v]) => k + ': ' + v).join('; ');
  if(m) return oud.replace(re, (all, pre) => pre + seg);
  return oud.trim() ? oud.trim() + ' · ' + seg : seg;
}

function lkTermen(land){
  const l = String(land || '').toLowerCase();
  const T = [
    [/spanje|spain|espa/, 'ficha técnica, nota de cata, bodega, crianza/reserva'],
    [/frankrijk|france/, 'fiche technique, notes de dégustation, domaine, garde'],
    [/ital/, 'scheda tecnica, note di degustazione, azienda'],
    [/portugal/, 'ficha técnica, notas de prova, produtor'],
    [/duitsland|germany|oostenrijk|austria|zwitserland|switzerland/, 'Datenblatt, Weingut, Lagerfähigkeit, Trinkreife'],
    [/chili|chile|argentini/, 'ficha técnica, bodega, nota de cata'],
    [/zuid-afrika|south africa|australi|nieuw-zeeland|new zealand|verenigde staten|usa|amerika|engeland|verenigd koninkrijk/, 'tech sheet, fact sheet, tasting notes, cellaring']
  ];
  const hit = T.find(([re]) => re.test(l));
  return hit ? hit[1] : 'fiche technique / ficha técnica / scheda tecnica / Datenblatt / tech sheet (kies de taal van het land van herkomst)';
}

function veld(f, w){
  const v = esc(w[f.k] ?? (f.def ? 1 : ''));
  let inp;
  if(f.sel) inp = `<select id="f_${f.k}"><option value=""></option>${f.sel.map(o => `<option ${w[f.k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  else if(f.area) inp = `<textarea id="f_${f.k}">${v}</textarea>`;
  else inp = `<input id="f_${f.k}" value="${v}" placeholder="${esc(f.ph || '')}" ${f.num ? 'type="number" inputmode="numeric" min="0"' : ''} ${f.im ? `inputmode="${f.im}"` : ''} ${f.list ? `list="dl_${f.k}"` : ''} autocomplete="off">`
        + (f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${o}">`).join('')}</datalist>` : '');
  return {half:f.half, html:`<div><label for="f_${f.k}">${f.l}</label>${inp}</div>`};
}
function toonForm(w){ ovOpen({ov:'form', id: w ? w.id : null}); }
function showForm(w){
  const nieuw = !w; w = w || {aantal:1};
  fotoData = null;
  const FM = Object.fromEntries(F.map(f => [f.k, f]));
  let html = `<details class="sec lookup"><summary>Gegevens zoeken met Claude</summary><div class="in">
      <div class="klein" style="margin-bottom:10px">1) Vul in wat je weet (naam, jaar, producent) · 2) kopieer de zoekopdracht · 3) plak hem in Claude en voeg het liefst een <b>foto van het etiket</b> toe (daar staan alcohol en jaargang op) · 4) plak het antwoord hieronder.</div>
      <div class="rij2"><button class="knop sec" id="bKopie" type="button" style="margin:0">Kopieer zoekopdracht</button><button class="knop sec" id="bClaude" type="button" style="margin:0">Open Claude</button></div>
      <label class="chk" style="font-weight:400;font-size:calc(18px*var(--fs));margin:12px 0 0;text-transform:none;letter-spacing:0"><input type="checkbox" id="vulNaam" checked><span class="box"></span> Naam en jaar ook overnemen</label>
      <label class="chk" style="font-weight:400;font-size:calc(18px*var(--fs));margin:8px 0 0;text-transform:none;letter-spacing:0"><input type="checkbox" id="bewaarBron" checked><span class="box"></span> Bronnen bewaren in opmerkingen</label>
      <textarea id="plakJson" placeholder="Plak hier het antwoord van Claude (JSON)" style="margin-top:10px;min-height:64px"></textarea>
      <button class="knop" id="bVul" type="button" style="margin-top:10px">Velden invullen</button>
      <div id="review"></div>
    </div></details>`;
  GROEPEN.forEach(([titel, keys, open], gi) => {
    const heeft = !nieuw && keys.some(k => w[k] && k !== 'aantal');
    let buf = '', inner = gi === 0 ? `<label>Foto van etiket</label><div class="foto" id="fotoBox" style="${w.fotoId ? `background-image:url('${fotoUrl(w.fotoId)}');border-style:solid` : ''}">${w.fotoId ? '' : 'Tik om foto te maken / kiezen'}</div><input type="file" id="fotoIn" accept="image/*" style="display:none">` : '';
    const flush = () => { if(buf){ inner += `<div class="rij">${buf}</div>`; buf = ''; } };
    let pend = 0;
    keys.forEach(k => { const x = veld(FM[k], w); if(x.half){ buf += x.html; if(++pend === 2){ flush(); pend = 0; } } else { flush(); pend = 0; inner += x.html; } });
    flush();
    html += `<details class="sec" ${open || heeft ? 'open' : ''}><summary>${titel}</summary><div class="in">${inner}</div></details>`;
  });
  html += `<div class="savebar"><button class="knop" id="bSave">${nieuw ? 'Wijn toevoegen' : 'Opslaan'}</button></div>`;
  openOv(nieuw ? 'Nieuwe wijn' : 'Bewerken', html, '');

  $('#fotoBox').onclick = () => $('#fotoIn').click();
  $('#fotoIn').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if(!file) return;
    const r = await cropFoto(file); if(!r) return;
    fotoData = r;
    const b = $('#fotoBox'); b.textContent = ''; b.style.backgroundImage = `url(${fotoData})`; b.style.borderStyle = 'solid';
  };
  // ---- Opzoeken met Claude: prompt samenstellen ----
  const LK_VELDEN = ['producent','land','regio','druiven','type','stijl','smaak','body','alcohol','serveertemp','decanteren','drinkmoment','eten','drinkvanaf','drinktot','vivino','parker'];
  const val = k => { const e = $('#f_' + k); return e ? e.value.trim() : ''; };
  const vandaag = () => { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear(); };
  $('#bKopie').onclick = async () => {
    const bekend = ['producent','land','regio','druiven','type','stijl','alcohol','serveertemp'].filter(k => val(k)).map(k => LBL[k].toLowerCase() + ': ' + val(k)).join('; ');
    const leeg = LK_VELDEN.filter(k => !val(k) && k !== 'drinktot').map(k => k === 'drinkvanaf' ? 'drinkvenster' : LBL[k].toLowerCase()).join(', ');
    const heeftV = val('drinkvanaf') || val('drinktot');
    const venster = !heeftV ? 'geen' : /^gevonden/i.test(val('drinkbron')) ? 'bron' : 'inschatting';
    const p = lkPrompt({naam: val('naam'), producent: val('producent'), jaar: val('jaar'), land: val('land'), bekend, leeg, venster, datum: vandaag()});
    if(!val('naam') && !val('producent')) toast('Tip: plak ook een foto van het etiket in Claude', 4000);
    try{ await navigator.clipboard.writeText(p); if(val('naam') || val('producent')) toast('Zoekopdracht gekopieerd. Plak hem in Claude, het liefst met een foto van het etiket.', 4500); }
    catch(e){ $('#plakJson').value = p; toast('Kopieer de tekst uit het vak'); }
  };
  $('#bClaude').onclick = () => window.open('https://claude.ai/new', '_blank');

  // ---- Opzoeken met Claude: antwoord verwerken ----
  const R = $('#review');
  const applied = {};            // veld -> bron, voor de bronregel in opmerkingen
  const markOpen = el => { const d = el.closest('details'); if(d) d.open = true; };
  const norm = x => String(x ?? '').trim().toLowerCase().replace(/[–—]/g, '-').replace(/,/g, '.').replace(/\s+/g, ' ');
  const syncBron = () => {
    if(!$('#bewaarBron').checked) return;
    const ent = {};
    Object.keys(applied).forEach(k => { if(applied[k] && !LK_ZONDER_BRON.includes(k)) ent[(LBL[k] || k).toLowerCase()] = applied[k]; });
    if(!Object.keys(ent).length) return;
    const el = $('#f_opmerkingen'); el.value = lkBronMerge(el.value, ent, vandaag()); markOpen(el);
  };
  const resten = () => {
    const rest = LK_VELDEN.filter(k => !val(k) && k !== 'drinktot').map(k => k === 'drinkvanaf' ? 'drinkvenster' : LBL[k]);
    const box = R.querySelector('#lkRest'); if(!box) return;
    box.innerHTML = rest.length ? '<b>Nog leeg:</b> ' + esc(rest.join(', ')) + '.<br>Staat het op het etiket? Plak dan een foto in Claude en vraag alleen naar deze velden.' : 'Alle zoekvelden zijn gevuld.';
  };
  $('#bVul').onclick = () => {
    const t = $('#plakJson').value; const a = t.indexOf('{'), b = t.lastIndexOf('}');
    let o;
    try{ o = JSON.parse(t.slice(a, b + 1)); }catch(e){ toast('Kon het antwoord niet lezen: plak alleen het JSON-deel', 4000); return; }
    const N = lkNormaliseer(o, {jaarForm: val('jaar'), jaarNu: new Date().getFullYear(), lbl: LBL});
    const onzeker = N.herkenning === 'onzeker';
    const gevuld = [], check = [];
    const sfx = k => [N.bronnen[k] ? 'bron: ' + N.bronnen[k] : (N.nieuwFormaat && LK_FEITEN.includes(k) ? 'geen bron opgegeven' : ''), N.zk[k] ? 'zekerheid: ' + N.zk[k] : ''].filter(Boolean).join(' · ');
    const lijn = (lbl, v, k) => ({lbl, v, s: sfx(k)});

    // 1) drinkvenster als één groep
    if(N.vals.drinkvanaf || N.vals.drinktot){
      const cur = {drinkvanaf: val('drinkvanaf'), drinktot: val('drinktot'), drinkbron: val('drinkbron')};
      const nw = {drinkvanaf: N.vals.drinkvanaf || '', drinktot: N.vals.drinktot || '', drinkbron: N.vals.drinkbron || ''};
      const txt = x => (x.drinkvanaf || '…') + ' – ' + (x.drinktot || '…') + (x.drinkbron ? ' (' + x.drinkbron + ')' : '');
      const curLeeg = !cur.drinkvanaf && !cur.drinktot, zelfde = cur.drinkvanaf === nw.drinkvanaf && cur.drinktot === nw.drinktot;
      const curGevonden = /^gevonden/i.test(cur.drinkbron), nwGevonden = /^gevonden/i.test(nw.drinkbron);
      const zet = () => { ['drinkvanaf','drinktot','drinkbron'].forEach(k => { $('#f_' + k).value = nw[k]; }); markOpen($('#f_drinkbron')); };
      const sx = sfx('drinkvanaf') || sfx('drinkbron');
      if(curLeeg && !onzeker && N.zk.drinkvanaf !== 'laag'){ zet(); gevuld.push({lbl: 'Drinkvenster', v: txt(nw), s: sx}); }
      else if(zelfde){ if(!cur.drinkbron || (!curGevonden && nwGevonden)){ $('#f_drinkbron').value = nw.drinkbron; gevuld.push({lbl: 'Bron drinkvenster', v: nw.drinkbron, s: sx}); } }
      else if(curGevonden && !nwGevonden && !curLeeg) N.warn.push('Drinkvenster: bestaand venster met bron behouden; Claude had alleen een inschatting');
      else check.push({groep: 1, lbl: 'Drinkvenster', oud: curLeeg ? '' : txt(cur), nv: txt(nw), zet, s: sx});
    }
    // 2) overige velden
    Object.keys(N.vals).forEach(k => {
      if(['drinkvanaf','drinktot','drinkbron'].includes(k)) return;
      const el = $('#f_' + k); if(!el) return;
      const nv = N.vals[k];
      if(k === 'naam' || k === 'jaar'){ if(!onzeker && $('#vulNaam').checked && norm(el.value) !== norm(nv)){ el.value = nv; gevuld.push(lijn(LBL[k], nv, k)); } return; }
      const laag = onzeker || N.zk[k] === 'laag';
      if(!el.value.trim()){
        if(laag) check.push({k, el, nv, leeg: true, s: sfx(k)});
        else { el.value = nv; markOpen(el); gevuld.push(lijn(LBL[k], nv, k)); applied[k] = N.bronnen[k] || ''; }
      } else if(norm(el.value) !== norm(nv)) check.push({k, el, nv, s: sfx(k)});
    });
    syncBron();
    $('#plakJson').value = '';

    // 3) overzicht tonen
    let h = '';
    if(onzeker) h += '<div class="lkw"><b>Claude is niet zeker welke wijn dit is.</b> Er is niets automatisch ingevuld: kies per veld. Plak een foto van het etiket in Claude voor een beter resultaat.</div>';
    else if(N.herkenning === 'waarschijnlijk') h += '<div class="lkw">Claude is er <b>vrij zeker</b> van dat dit de juiste wijn is, maar niet helemaal. Controleer de waarden.</div>';
    if(gevuld.length) h += '<details class="lkok" open><summary>' + gevuld.length + ' velden ingevuld</summary>' + gevuld.map(g => '<div><b>' + esc(g.lbl) + '</b>: ' + esc(g.v) + (g.s ? '<div class="bron">' + esc(g.s) + '</div>' : '') + '</div>').join('') + '</details>';
    if(N.warn.length) h += '<div class="lkw"><b>Aangepast of genegeerd:</b><br>' + N.warn.map(esc).join('<br>') + '</div>';
    if(check.length) h += '<div class="klein" style="margin:14px 0 6px"><b>Te controleren:</b> kies per veld wat je wilt.</div>';
    h += '<div id="lkRows"></div><div class="klein" id="lkRest" style="margin-top:12px"></div>';
    R.innerHTML = h;
    check.forEach(c => {
      const row = document.createElement('div'); row.className = 'rv';
      const kan = !c.groep && c.el.tagName !== 'SELECT' && !c.leeg;
      const oud = c.groep ? c.oud : (c.leeg ? '' : c.el.value);
      row.innerHTML = `<b>${esc(c.lbl || LBL[c.k] || c.k)}</b>${oud ? `<div class="oud">Nu: ${esc(oud)}</div>` : ''}<div class="nieuw">Claude: ${esc(c.nv)}</div>${c.s ? `<div class="bron">${esc(c.s)}</div>` : ''}<div class="rvb">${c.leeg ? '<button type="button" data-a="rep">Overnemen</button>' : (kan ? '<button type="button" data-a="add">Toevoegen</button>' : '') + '<button type="button" data-a="rep">Vervangen</button>'}<button type="button" data-a="skip">Negeren</button></div>`;
      row.onclick = e => {
        const act = e.target.dataset.a; if(!act) return;
        if(c.groep){ if(act === 'rep'){ c.zet(); applied.drinkvenster = ''; } }
        else {
          if(act === 'add') c.el.value = c.el.value.trim() + (c.k === 'opmerkingen' ? ' · ' : ', ') + c.nv;
          if(act === 'rep') c.el.value = c.nv;
          if(act !== 'skip'){ markOpen(c.el); applied[c.k] = N.bronnen[c.k] || ''; }
        }
        row.remove(); syncBron(); resten();
      };
      R.querySelector('#lkRows').appendChild(row);
    });
    resten();
    toast((gevuld.length ? gevuld.length + ' velden ingevuld' : 'Niets automatisch ingevuld') + (check.length ? ' · ' + check.length + ' om te controleren' : ''), 3500);
  };
  $('#bSave').onclick = async () => {
    const x = {};
    F.forEach(f => x[f.k] = $('#f_' + f.k).value.trim());
    if(!x.naam){ toast('Naam is verplicht'); const d = $('#f_naam').closest('details'); d.open = true; $('#f_naam').focus(); return; }
    x.aantal = Number(x.aantal) || 0;
    x.drinkvenster = x.drinkvanaf && x.drinktot ? x.drinkvanaf + ' - ' + x.drinktot : x.drinkvanaf ? 'vanaf ' + x.drinkvanaf : x.drinktot ? 'tot ' + x.drinktot : '';
    if(!nieuw) x.id = w.id;
    const btn = $('#bSave'); btn.disabled = true; btn.textContent = 'Opslaan …';
    try{
      const j = await api({action:'save', wijn:x, foto: fotoData ? fotoData.split(',')[1] : undefined});
      const i = wines.findIndex(y => y.id === j.wijn.id);
      if(i >= 0) wines[i] = j.wijn; else wines.push(j.wijn);
      localStorage.setItem('wijn_cache', JSON.stringify(wines));
      const id = j.wijn.id; teken();
      const kwijt = F.filter(f => x[f.k] && !j.wijn[f.k]).map(f => f.l);
      if(kwijt.length) toast('Let op: niet opgeslagen door de Sheet: ' + kwijt.join(', ') + '. Werk Code.gs bij en implementeer een nieuwe versie.', 9000);
      else toast(nieuw ? 'Toegevoegd' : 'Opgeslagen');
      if(nieuw){
        if(wide()){ history.back(); setTimeout(() => showPane(id), 40); }
        else { history.replaceState({ov:'detail', id}, ''); renderOv({ov:'detail', id}); }
      } else {
        history.back(); if(wide()) setTimeout(() => showPane(id), 40);
      }
    }catch(e){ toast('Mislukt: ' + e.message, 5000); btn.disabled = false; btn.textContent = nieuw ? 'Wijn toevoegen' : 'Opslaan'; }
  };
}

// Foto zoomen / verschuiven op het formaat van het fotovak (93 x 44 mm)
function cropFoto(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast('Foto kon niet worden geladen'); res(null); };
    img.onload = () => {
      const AR = 93/44, W = Math.min(window.innerWidth - 28, 720), H = Math.round(W / AR), dpr = Math.min(window.devicePixelRatio || 1, 2);
      const el = document.createElement('div'); el.id = 'crop';
      el.innerHTML = `<div class="crh"><button id="cX">Annuleer</button><b>Foto op etiket</b><button id="cOK">Klaar</button></div>
        <div class="crw"><canvas id="cv"></canvas></div>
        <div class="crc"><input type="range" id="cz" min="0" max="1000" value="0">
        <label class="chk"><input type="checkbox" id="cBW" checked><span class="box"></span> Zwart-wit optimaliseren (voor de printer)</label>
        <label id="cCL">Contrast <input type="range" id="cC" min="80" max="260" value="150" style="flex:1"></label>
        <div class="rij2"><button id="cFit">Hele foto</button><button id="cFill">Vul vak</button></div>
        <div class="klein">Sleep om te verschuiven · knijp of schuif om te zoomen. Het kader is het fotovak op het etiket.</div></div>`;
      document.body.appendChild(el);
      const cv = el.querySelector('#cv'), z = el.querySelector('#cz'), ctx = cv.getContext('2d'), bw = el.querySelector('#cBW'), cc = el.querySelector('#cC');
      const bwProc = (c2d, w, h) => {
        const id = c2d.getImageData(0, 0, w, h), d = id.data, k = cc.value / 100;
        for(let i = 0; i < d.length; i += 4){
          let g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          g = (g - 128) * k + 128 + 10; g = g < 0 ? 0 : g > 255 ? 255 : g;
          d[i] = d[i+1] = d[i+2] = g;
        }
        c2d.putImageData(id, 0, 0);
      };
      cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const sMin = Math.min(W/iw, H/ih), sCov = Math.max(W/iw, H/ih), sMax = sCov * 5;
      let s = sCov, ox = (W - iw*s)/2, oy = (H - ih*s)/2;
      const clamp = () => {
        const w = iw*s, h = ih*s;
        ox = w <= W ? (W - w)/2 : Math.min(0, Math.max(W - w, ox));
        oy = h <= H ? (H - h)/2 : Math.min(0, Math.max(H - h, oy));
      };
      const draw = () => {
        ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
        ctx.drawImage(img, ox, oy, iw*s, ih*s);
        if(bw.checked) bwProc(ctx, cv.width, cv.height);
        el.querySelector('#cCL').style.display = bw.checked ? 'flex' : 'none';
        z.value = Math.round(1000 * Math.log(s/sMin) / Math.log(sMax/sMin));
      };
      const setScale = (ns, cx, cy) => {
        ns = Math.min(sMax, Math.max(sMin, ns));
        ox = cx - (cx - ox) * (ns/s); oy = cy - (cy - oy) * (ns/s); s = ns; clamp(); draw();
      };
      clamp(); draw();
      bw.onchange = cc.oninput = () => draw();
      z.oninput = () => setScale(sMin * Math.pow(sMax/sMin, z.value/1000), W/2, H/2);
      el.querySelector('#cFit').onclick = () => setScale(sMin, W/2, H/2);
      el.querySelector('#cFill').onclick = () => setScale(sCov, W/2, H/2);
      const P = new Map(), pos = e => { const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
      cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); P.set(e.pointerId, pos(e)); };
      cv.onpointermove = e => {
        if(!P.has(e.pointerId)) return;
        const n = pos(e), o = P.get(e.pointerId);
        if(P.size === 1){ ox += n.x - o.x; oy += n.y - o.y; clamp(); draw(); }
        else {
          const other = [...P.entries()].find(([id]) => id !== e.pointerId)[1];
          const d0 = Math.hypot(o.x-other.x, o.y-other.y) || 1, d1 = Math.hypot(n.x-other.x, n.y-other.y);
          ox += (n.x - o.x)/2; oy += (n.y - o.y)/2;
          setScale(s * d1/d0, (n.x+other.x)/2, (n.y+other.y)/2);
        }
        P.set(e.pointerId, n);
      };
      cv.onpointerup = cv.onpointercancel = e => P.delete(e.pointerId);
      cv.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); setScale(s * Math.exp(-e.deltaY * 0.0015), p.x, p.y); }, {passive:false});
      const klaar = r => { el.remove(); URL.revokeObjectURL(url); res(r); };
      el.querySelector('#cX').onclick = () => klaar(null);
      el.querySelector('#cOK').onclick = () => {
        const OW = 1400, OH = Math.round(OW / AR), k = OW / W, o = document.createElement('canvas');
        o.width = OW; o.height = OH; const c = o.getContext('2d');
        c.fillStyle = '#fff'; c.fillRect(0,0,OW,OH); c.drawImage(img, ox*k, oy*k, iw*s*k, ih*s*k);
        if(bw.checked) bwProc(c, OW, OH);
        klaar(o.toDataURL('image/jpeg', .85));
      };
    };
    img.src = url;
  });
}
function verklein(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = rej; img.src = u;
  });
}


// ===================== ETIKET PRINTEN =====================
function labelHTML(w){
  const v = k => esc(w[k] || '');
  const regio = [w.land, w.regio].filter(Boolean).map(esc).join('<br>');
  const dr = String(w.druiven||''), drc = dr.length > 50 ? 'xs' : dr.length > 26 ? 'sm' : '';
  return `<div class="lbl"><div class="in">
    <div class="t1">${v('naam')}</div>
    <div class="t2">${v('producent')}</div>
    <div class="ft" ${w.fotoId?`style="background-image:url('${fotoUrl(w.fotoId)}')"`:''}></div>
    <table class="g">
      <tr><td>${v('jaar')}</td><td>${v('type').toUpperCase()}</td><td>${v('stijl')}</td></tr>
      <tr><td>${regio}</td><td class="${drc}">${v('druiven')}</td><td class="b">${v('vak')}</td></tr>
      <tr><td>${v('aankoop')}</td><td>${v('gekochtbij')}</td><td class="b">${w.aantal||''}</td></tr>
    </table>
    <table class="i">
      <tr><td class="k">Smaakprofiel</td><td>${v('smaak')}</td></tr>
      <tr><td class="k">Drinkmoment</td><td>${v('drinkmoment')}</td></tr>
      <tr><td class="k">Eetcombinatie</td><td>${v('eten')}</td></tr>
      ${(w.score||w.vivino||w.parker) ? `<tr><td class="k">Scores</td><td>${[w.vivino&&'Vivino '+esc(w.vivino), w.parker&&'Parker '+esc(w.parker), w.score&&'Eigen '+esc(w.score)].filter(Boolean).join(' · ')}</td></tr>` : ''}
    </table>
    <div class="dvl"><b>Drinkvenster</b><span>${esc(venster(w).tekst || w.drinkvenster || '')}</span></div>
    <div class="kv"><b>Opmerkingen</b><span>${v('opmerkingen')}</span></div>
  </div></div>`;
}
// Verkleint het etiket zo nodig, zodat het altijd op 1 pagina past (103 x 164 mm)
function fitLabel(pa){
  pa.style.cssText = 'display:block;position:absolute;left:-9999px;top:0;width:103mm';
  const lbl = pa.querySelector('.lbl'), inn = pa.querySelector('.in');
  inn.style.transform = ''; inn.style.width = '';
  const maxH = (157 - 8) * 96 / 25.4;
  const h = inn.offsetHeight;
  if(h > maxH){
    const sc = Math.max(0.55, maxH / h);
    inn.style.width = (100 / sc) + '%';
    inn.style.transform = 'scale(' + sc + ')';
  }
  pa.style.cssText = '';
}
async function printLabel(w){
  const pa = $('#printArea'); pa.innerHTML = labelHTML(w);
  fitLabel(pa);
  if(w.fotoId){ // wacht tot de foto geladen is
    await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = fotoUrl(w.fotoId); setTimeout(r, 4000); });
  }
  setTimeout(() => window.print(), 150);
}
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

teken();
if(!cfg.url) setTab('instel'); else laad();
